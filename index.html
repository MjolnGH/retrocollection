    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'retro-collection-tracker';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.CloudSync = {
                appId,
                auth,
                db,
                doc,
                setDoc,
                getDoc,
                collection,
                onSnapshot,
                signInAnonymously,
                signInWithCustomToken,
                onAuthStateChanged,
                GoogleAuthProvider,
                signInWithPopup,
                signOut
            };
        }
    </script>

    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-purple: #8a2be2;
            --dark-bg: #050510;
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            /* Retro synthwave grid background */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center bottom;
            background-attachment: fixed;
        }

        /* CRT Screen Effect Overlay */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .font-pixel { font-family: 'Press Start 2P', cursive; }
        .font-terminal { font-family: 'VT323', monospace; }

        /* Neon Text Effects */
        .neon-text-pink {
            text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }
        .neon-text-blue {
            text-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        /* Neon Box Effects */
        .neon-border-pink {
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink), inset 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .neon-border-blue {
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-pink); }

        /* Game Card Hover Animation */
        .game-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .game-card:hover {
            transform: translateY(-5px) scale(1.02);
            z-index: 10;
        }

        /* Virtual Box Art Gradient */
        .virtual-box {
            background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
            position: relative;
            overflow: hidden;
        }
        .virtual-box::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Scrollbar mini pour les descriptions */
        .custom-scrollbar-mini::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar-mini::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar-mini::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 2px; }
    </style>
</head>

        const getMatchInfo = (list, title) => {
            const normInput = title.toLowerCase().replace(/[^a-z0-9]/g, '');
            for (let item of list) {
                const match = item.match(/(.*?)(?:\((.*)\))?$/);
                const rawName = match[1].trim();
                const note = match[2] ? match[2].trim() : null;
                const normList = rawName.toLowerCase().replace(/[^a-z0-9]/g, '');
                
                if (normList === normInput || 
                    (normList.length > 5 && normInput.includes(normList)) || 
                    (normInput.length > 5 && normList.includes(normInput))) {
                    return { found: true, note };
                }
            }
            return { found: false };
        };

        const getMegadriveCompatibility = (title) => {
            if (!title) return { status: 'unknown', note: null };
            
            // On vérifie d'abord les incompatibles car ils contiennent souvent des infos plus spécifiques (ex: bugs mineurs)
            const incomp = getMatchInfo(mdIncompatibleRaw, title);
            if (incomp.found) return { status: 'incompatible', note: incomp.note || 'Incompatible 60Hz' };
            
            const comp = getMatchInfo(mdCompatibleRaw, title);
            if (comp.found) return { status: 'compatible', note: comp.note || 'Compatible 60Hz' };
            
            return { status: 'unknown', note: null };
        };

                setGames(updatedGames);
                localStorage.setItem('retroTrackerData', JSON.stringify(updatedGames));

                if (window.CloudSync && (userId || syncCode)) {
                    setSyncStatus('syncing');
                    const { db, doc, setDoc, appId } = window.CloudSync;
                    const docRef = syncCode
                        ? doc(db, 'artifacts', appId, 'public', 'data', 'sharedCollections', syncCode)
                        : doc(db, 'artifacts', appId, 'users', userId, 'data', 'gamesCollection');

                    setDoc(docRef, { games: updatedGames, lastUpdated: Date.now() })
                        .then(() => {
                            setSyncStatus('saved');
                            setTimeout(() => setSyncStatus('idle'), 2000);
                        })
                        .catch((err) => {
                            console.error("Erreur de sauvegarde Cloud:", err);
                            setSyncStatus('error');
                        });
                }
            };

            const [activeConsole, setActiveConsole] = React.useState("Toutes");
            const [searchQuery, setSearchQuery] = React.useState("");
            const [showAddForm, setShowAddForm] = React.useState(false);
            const [sortMode, setSortMode] = React.useState("alpha");
            
            // Form State
            const [newTitle, setNewTitle] = React.useState("");
            const [newConsole, setNewConsole] = React.useState("Megadrive");
            const [newStatus, setNewStatus] = React.useState("wanted");
            const [newImg, setNewImg] = React.useState("");
            const [newRegion, setNewRegion] = React.useState("PAL");
            const [editingId, setEditingId] = React.useState(null);

            const toggleGameStatus = (id) => {
                const targetGame = games.find(game => game.id === id);
                if (!targetGame) return;
                
                const updatedGame = { ...targetGame, status: targetGame.status === "owned" ? "wanted" : "owned" };
                const otherGames = games.filter(game => game.id !== id);
                saveGamesData([updatedGame, ...otherGames]);
            };

            const deleteGame = (id) => {
                saveGamesData(games.filter(game => game.id !== id));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!newTitle.trim()) return;
                
                let updatedList;
                if (editingId) {
                    updatedList = games.map(g => g.id === editingId ? {
                        ...g, title: newTitle, console: newConsole, status: newStatus, region: newRegion, img: newImg
                    } : g);
                    setEditingId(null);
                } else {
                    const newGame = {
                        id: Date.now(),
                        title: newTitle,
                        console: newConsole,
                        status: newStatus,
                        region: newRegion,
                        img: newImg
                    };
                    updatedList = [newGame, ...games];
                }
                
                saveGamesData(updatedList);
                setNewTitle("");
                setNewImg("");
                setShowAddForm(false);
            };

            const handleEdit = (game) => {
                setNewTitle(game.title);
                setNewConsole(game.console);
                setNewRegion(game.region);
                setNewStatus(game.status);
                setNewImg(game.img || "");
                setEditingId(game.id);
                setShowAddForm(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleToggleForm = () => {
                if (showAddForm) {
                    setEditingId(null);
                    setNewTitle("");
                    setNewImg("");
                }
                setShowAddForm(!showAddForm);
            };

            // ---- Fonction d'Importation ----
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    try {
                        const data = JSON.parse(content);
                        if (Array.isArray(data)) {
                            if(window.confirm("Remplacer votre collection actuelle par ce fichier ?")) {
                                saveGamesData(data);
                            }
                            return;
                        }
                    } catch (err) {
                        const match = content.match(/const initialGames = (\[[\s\S]*?\]);\s*const CONSOLES/);
                        if (match && match[1]) {
                            try {
                                const extractedGames = JSON.parse(match[1]);
                                if (Array.isArray(extractedGames)) {
                                    if(window.confirm("Importer la collection contenue dans ce fichier HTML ? Cela remplacera la vôtre.")) {
                                        saveGamesData(extractedGames);
                                    }
                                    return;
                                }
                            } catch (e2) {
                                console.error(e2);
                            }
                        }
                        alert("Erreur : Impossible de lire les données. Assurez-vous d'utiliser un fichier de sauvegarde valide.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            // ---- Fonction d'Exportation de données (JSON) ----
            const exportJSON = () => {
                try {
                    const dataStr = JSON.stringify(games, null, 2);
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'sauvegarde_collection.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error("Erreur d'export:", error);
                    alert("Une erreur s'est produite lors de la sauvegarde des données.");
                }
            };

            // ---- Fonction d'Exportation HTML complet ----
            const exportHTML = () => {
                try {
                    const scriptNode = document.querySelector('script[type="text/babel"]');
                    if (!scriptNode) return;
                    
                    let scriptContent = scriptNode.textContent;
                    const gamesJSON = JSON.stringify(games, null, 12);
                    
                    scriptContent = scriptContent.replace(/const initialGames = [\s\S]*?\];\s*const CONSOLES/, `const initialGames = ${gamesJSON};\n\n        const CONSOLES`);

                    const styleContent = document.querySelector('style') ? document.querySelector('style').textContent : '';

                    const fullHTML = `<!DOCTYPE html>\n<html lang="fr">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>RetroCollec Online</title>\n    <script src="https://cdn.tailwindcss.com"><\/script>\n    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>\n    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>\n    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>\n    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">\n    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">\n    <style>${styleContent}<\/style>\n</head>\n<body class="crt min-h-screen">\n    <div id="root"></div>\n    <script type="text/babel">${scriptContent}<\/script>\n</body>\n<\/html>`;

                    const blob = new Blob([fullHTML], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'retrocollec_online.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error("Erreur d'export HTML:", error);
                    alert("Une erreur s'est produite lors de la génération du fichier HTML.");
                }
            };

            const filteredGames = games.filter(g => {
                const matchesConsole = activeConsole === "Toutes" || g.console === activeConsole;
                const matchesSearch = g.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesConsole && matchesSearch;
            });

            const sortedGames = [...filteredGames].sort((a, b) => {
                if (sortMode === "alpha") {
                    return a.title.localeCompare(b.title);
                }
                return b.id - a.id;
            });

            const ownedGames = sortedGames.filter(g => g.status === "owned");
            const wantedGames = sortedGames.filter(g => g.status === "wanted");

            return (
                <div className="container mx-auto px-4 py-6 max-w-7xl relative z-10 font-terminal">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-purple-900/50 pb-6">
                        <div>
                            <h1 className="font-pixel text-2xl sm:text-3xl md:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 font-bold mb-2">
                                RETROCOLLEC ONLINE
                            </h1>
                            <p className="text-gray-400 text-lg sm:text-xl">Gestionnaire de Collection Retrogaming</p>
                        </div>

                        {/* Badge de statut Cloud Sync & Bouton Google Auth / Code */}
                        <div className="inline-flex flex-wrap items-center justify-center gap-3 bg-gray-900/90 border border-purple-500/50 px-4 py-2 rounded-2xl text-xs font-pixel shadow-lg">
                            <div className="flex items-center gap-2">
                                {isCloudConnected ? (
                                    <>
                                        <span className="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></span>
                                        <span className="text-green-300">SYNCHRO ACTIVE</span>
                                        {syncStatus === 'syncing' && <span className="text-yellow-400 text-[9px] ml-1">(Envoi...)</span>}
                                        {syncStatus === 'saved' && <span className="text-blue-300 text-[9px] ml-1">(OK ✓)</span>}
                                    </>
                                ) : (
                                    <>
                                        <span className="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
                                        <span className="text-yellow-300">LOCAL</span>
                                    </>
                                )}
                            </div>

                            <div className="h-4 w-px bg-purple-500/40 hidden sm:block"></div>

                            {/* Section Compte ou Code de Synchro */}
                            {syncCode ? (
                                <div className="flex items-center gap-2 bg-blue-950/80 border border-blue-400/50 px-3 py-1 rounded-xl">
                                    <i className="fas fa-key text-yellow-400"></i>
                                    <span className="text-blue-200 text-[9px] sm:text-[10px] font-terminal text-lg tracking-wide">CODE: {syncCode.toUpperCase()}</span>
                                    <button 
                                        onClick={handleDisableSyncCode}
                                        className="ml-2 text-gray-400 hover:text-red-400 text-xs transition-colors"
                                        title="Déconnecter ce code"
                                    >
                                        <i className="fas fa-sign-out-alt"></i>
                                    </button>
                                </div>
                            ) : userEmail ? (
                                <div className="flex items-center gap-2 bg-purple-950/80 border border-purple-400/50 px-3 py-1 rounded-xl">
                                    <i className="fab fa-google text-red-400"></i>
                                    <span className="text-purple-200 text-[9px] sm:text-[10px] font-terminal text-lg tracking-wide">{userEmail}</span>
                                    <button 
                                        onClick={handleSignOut}
                                        className="ml-2 text-gray-400 hover:text-red-400 text-xs transition-colors"

                                        <i className="fas fa-sign-out-alt"></i>
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setShowAuthModal(true)}
                                    className="bg-pink-600/90 hover:bg-pink-500 text-white text-[9px] px-3 py-1 rounded-xl flex items-center gap-2 transition-all shadow-[0_0_10px_rgba(236,72,153,0.4)]"
                                >
                                    <i className="fas fa-mobile-alt"></i>
                                    <span>Accéder partout / Synchroniser</span>
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Modal d'Accès Multi-Appareils (Lien, Code & Cloud) */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
                            <div className="bg-gray-900 border-2 border-pink-500 p-6 rounded-lg max-w-lg w-full shadow-[0_0_30px_rgba(236,72,153,0.4)] relative max-h-[90vh] overflow-y-auto custom-scrollbar-mini">
                                <button 
                                    onClick={() => setShowAuthModal(false)}
                                    className="absolute top-3 right-3 text-gray-400 hover:text-white text-xl"
                                >
                                    <i className="fas fa-times"></i>
                                </button>

                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 rounded-full bg-pink-500/20 border border-pink-500 flex items-center justify-center mx-auto mb-3 text-pink-400 text-2xl">
                                        <i className="fas fa-share-alt"></i>
                                    </div>
                                    <h3 className="font-pixel text-lg text-white mb-2">Accéder à ma collection partout</h3>
                                    <p className="font-terminal text-xl text-gray-300">
                                        Choisissez la méthode la plus pratique pour vous :
                                    </p>
                                </div>

                                {copiedMessage && (
                                    <div className="mb-6 p-3 bg-green-950/90 border border-green-500 rounded text-green-200 font-terminal text-lg text-center animate-bounce">
                                        <i className="fas fa-check-circle mr-2 text-green-400"></i>
                                        {copiedMessage}
                                    </div>
                                )}

                                {authError && (
                                    <div className="mb-6 p-3 bg-red-950/90 border border-red-500 rounded text-red-200 font-terminal text-lg leading-snug">
                                        <i className="fas fa-exclamation-triangle text-yellow-400 mr-2"></i>
                                        {authError}
                                    </div>
                                )}

                                <div className="space-y-5">
                                    {/* METHODE 1 : Lien Magique (100% garanti) */}
                                    <div className="bg-gray-800/90 border border-purple-500/60 p-4 rounded-lg">
                                        <h4 className="font-pixel text-xs text-purple-300 mb-2 flex items-center gap-2">
                                            <i className="fas fa-link text-yellow-400"></i>
                                            <span>Méthode 1 : Le Lien Magique (Instant)</span>
                                        </h4>
                                        <p className="font-terminal text-lg text-gray-300 mb-3">
                                            Génère un lien direct contenant votre collection. Envoyez-le-vous par WhatsApp ou Mail et ouvrez-le sur votre téléphone ou autre PC !
                                        </p>
                                        <button 
                                            onClick={generateShareableLink}
                                            className="w-full bg-purple-600 hover:bg-purple-500 text-white font-pixel text-[10px] py-2.5 px-4 rounded transition-colors uppercase shadow-md flex items-center justify-center gap-2"
                                        >
                                            <i className="fas fa-copy"></i>
                                            <span>Générer & Copier le lien magique</span>
                                        </button>
                                    </div>

                                    {/* METHODE 2 : Code PIN / Pseudo Cloud */}
                                    <div className="bg-gray-800/90 border border-blue-500/60 p-4 rounded-lg">
                                        <h4 className="font-pixel text-xs text-blue-300 mb-2 flex items-center gap-2">
                                            <i className="fas fa-key text-yellow-400"></i>
                                            <span>Méthode 2 : Code PIN / Pseudo Cloud</span>
                                        </h4>
                                        <p className="font-terminal text-lg text-gray-300 mb-3">
                                            Créez un mot de passe ou un pseudo (ex: <code className="text-pink-400">retrogamer88</code>). Entrez le même code sur tous vos appareils pour tout synchroniser.
                                        </p>
                                        <form onSubmit={handleEnableSyncCode} className="space-y-2">
                                            <input 
                                                type="text" 
                                                required
                                                placeholder="ex: retrogamer88" 
                                                value={inputSyncCode} 
                                                onChange={(e) => setInputSyncCode(e.target.value)}
                                                className="w-full bg-black border border-blue-500 text-white p-2 rounded font-terminal text-xl focus:outline-none focus:border-pink-500"
                                            />
                                            <button 
                                                type="submit"
                                                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-pixel text-[10px] py-2.5 px-4 rounded transition-colors uppercase shadow-md"
                                            >
                                                Activer la synchronisation par ce code
                                            </button>
                                        </form>
                                    </div>

                                    {/* METHODE 3 : Copier / Coller de Code Texte */}
                                    <div className="bg-gray-800/90 border border-gray-700 p-4 rounded-lg">
                                        <h4 className="font-pixel text-xs text-gray-300 mb-2 flex items-center gap-2">
                                            <i className="fas fa-paste text-pink-400"></i>
                                            <span>Méthode 3 : Code Texte (Copier / Coller)</span>
                                        </h4>
                                        <div className="flex gap-2 mb-3">
                                            <button 
                                                onClick={generateTextCode}
                                                className="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-pixel text-[9px] py-2 px-3 rounded transition-colors"
                                            >
                                                Copier le code de ma liste
                                            </button>
                                        </div>
                                        <form onSubmit={handleImportTextCode} className="space-y-2">
                                            <input 
                                                type="text" 
                                                placeholder="Collez le code texte ici pour importer..." 
                                                value={textCodeInput} 
                                                onChange={(e) => setTextCodeInput(e.target.value)}
                                                className="w-full bg-black border border-gray-600 text-white p-2 rounded font-terminal text-lg focus:outline-none focus:border-pink-500"
                                            />
                                            <button 
                                                type="submit"
                                                className="w-full bg-pink-600 hover:bg-pink-500 text-white font-pixel text-[9px] py-2 px-3 rounded transition-colors uppercase"
                                            >
                                                Importer ce code texte
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Controls (Search, Add, Tabs) */}
                    <div className="mb-8 space-y-6">
                        
                        {/* Console Tabs */}
                        <div className="flex flex-wrap justify-center gap-2 mb-6">
                            {CONSOLES.map(c => (
                                <button
                                    key={c}
                                    onClick={() => setActiveConsole(c)}
                                    className={`font-pixel text-[10px] sm:text-xs py-2 px-4 uppercase transition-all ${activeConsole === c ? 'bg-purple-600 text-white neon-border-blue' : 'bg-gray-800 text-gray-400 border border-gray-600 hover:bg-gray-700'}`}
                                >
                                    {c}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                            {/* Search */}
                            <div className="relative w-full md:flex-1">
                                <i className="fas fa-search absolute left-3 top-3 text-blue-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="Rechercher un jeu..." 
                                    className="w-full bg-gray-900 border-2 border-blue-500 text-blue-300 rounded-none py-2 pl-10 pr-4 font-terminal text-xl focus:outline-none focus:border-pink-500 transition-colors"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>

                            {/* Sort Dropdown */}
                            <div className="relative w-full md:w-48">
                                <i className="fas fa-sort absolute left-3 top-3 text-pink-400"></i>
                                <select 
                                    value={sortMode}
                                    onChange={(e) => setSortMode(e.target.value)}
                                    className="w-full bg-gray-900 border-2 border-pink-500 text-pink-300 rounded-none py-2 pl-10 pr-4 font-terminal text-xl focus:outline-none focus:border-blue-500 transition-colors appearance-none cursor-pointer"
                                >
                                    <option value="ajout">Tri : Ajout</option>
                                    <option value="alpha">Tri : A - Z</option>
                                </select>
                            </div>
                            
                            {/* Actions Buttons (Add, Export & Import) */}
                            <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto flex-wrap justify-end">
                                <button 
                                    onClick={handleToggleForm}
                                    className="w-full sm:w-auto bg-pink-600 hover:bg-pink-500 text-white font-pixel text-[9px] sm:text-[10px] py-3 px-3 neon-border-pink uppercase transition-all whitespace-nowrap"
                                >
                                    <i className={`fas ${showAddForm ? 'fa-times' : (editingId ? 'fa-edit' : 'fa-plus')} mr-1`}></i>
                                    {showAddForm ? 'Fermer' : (editingId ? 'Modifier' : 'Ajouter un jeu')}
                                </button>
                                
                                <button 
                                    onClick={exportJSON}
                                    className="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-pixel text-[9px] sm:text-[10px] py-3 px-3 neon-border-blue uppercase transition-all whitespace-nowrap"
                                    title="Télécharger une sauvegarde de votre liste (Fichier JSON/Texte)"
                                >
                                    <i className="fas fa-file-export mr-1"></i> JSON
                                </button>

                                <button 
                                    onClick={exportHTML}
                                    className="w-full sm:w-auto bg-purple-600 hover:bg-purple-500 text-white font-pixel text-[9px] sm:text-[10px] py-3 px-3 neon-border-blue uppercase transition-all whitespace-nowrap"
                                    title="Télécharger une copie de l'application avec vos données (Fichier HTML)"
                                >
                                    <i className="fas fa-file-export mr-1"></i> HTML
                                </button>

                                <input 
                                    type="file" 
                                    id="importFile" 
                                    accept=".json,.txt,.html" 
                                    style={{display: 'none'}} 
                                    onChange={handleImport} 
                                />
                                <button 
                                    onClick={() => document.getElementById('importFile').click()}
                                    className="w-full sm:w-auto bg-green-600 hover:bg-green-500 text-white font-pixel text-[9px] sm:text-[10px] py-3 px-3 neon-border-blue uppercase transition-all whitespace-nowrap"
                                    title="Restaurer une sauvegarde depuis un fichier"
                                >
                                    <i className="fas fa-file-import mr-1"></i> Importer
                                </button>
                            </div>
                        </div>

                        {/* Add Game Form */}
                        {showAddForm && (
                            <form onSubmit={handleSubmit} className="bg-gray-900 border-2 border-purple-500 p-6 shadow-[0_0_15px_#8a2be2] mb-8 animate-[fadeIn_0.3s_ease-out]">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 items-end">
                                    <div className="lg:col-span-2 relative">
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Titre du jeu</label>
                                        <input required type="text" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:border-pink-500 focus:outline-none"/>
                                        {newConsole === "Megadrive" && newTitle && (
                                            <div className="absolute top-[102%] left-0 text-[10px] font-pixel z-10 p-1 bg-black border border-gray-700 rounded w-full">
                                                {(() => {
                                                    const info = getMegadriveCompatibility(newTitle);
                                                    if (info.status === 'compatible') return <span className="text-green-400">✓ {info.note}</span>;
                                                    if (info.status === 'incompatible') return <span className="text-red-400">⚠ {info.note}</span>;
                                                    return <span className="text-gray-500">Statut 60Hz inconnu</span>;
                                                })()}
                                            </div>
                                        )}
                                    </div>
                                    <div>
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Console</label>
                                        <select value={newConsole} onChange={(e) => setNewConsole(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:outline-none">
                                            <option>Megadrive</option>
                                            <option>Super Famicom</option>
                                            <option>Master System</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Région</label>
                                        <select value={newRegion} onChange={(e) => setNewRegion(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:outline-none">
                                            <option value="PAL">PAL</option>
                                            <option value="US">US</option>
                                            <option value="JAP">JAP</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Statut</label>
                                        <select value={newStatus} onChange={(e) => setNewStatus(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:outline-none">
                                            <option value="wanted">Recherchés</option>
                                            <option value="owned">Possédé</option>
                                        </select>
                                    </div>
                                    <div>
                                        <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-pixel text-[10px] py-3 px-4 neon-border-blue h-[46px]">
                                            {editingId ? 'MODIFIER' : 'AJOUTER'}
                                        </button>
                                    </div>
                                    <div className="lg:col-span-6">
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">URL Image (Optionnel)</label>
                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <input 
                                                type="text" 
                                                value={newImg} 
                                                onChange={(e) => setNewImg(e.target.value)} 
                                                className="flex-1 bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:border-pink-500 focus:outline-none" 
                                                placeholder="Laissez vide pour une recherche automatique, ou collez une URL..."
                                            />
                                            {newTitle && (
                                                <a 
                                                    href={`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(newTitle + ' ' + newConsole + ' ' + newRegion + ' cover box art')}`}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-pixel text-[10px] py-2 px-4 flex items-center justify-center neon-border-blue transition-colors uppercase whitespace-nowrap"
                                                    title={`Chercher la jaquette ${newRegion} sur Google Images`}
                                                >
                                                    <i className="fas fa-search mr-2"></i> Trouver l'image
                                                </a>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </form>
                        )}
            
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* COLUMN: OWNED GAMES */}
                            <div className="bg-[#0a0a1a] border border-blue-900 rounded-xl p-4 md:p-6 shadow-[inset_0_0_50px_rgba(0,240,255,0.05)] h-full">
                                <h2 className="font-pixel text-xl md:text-2xl mb-6 text-center neon-text-blue border-b-2 border-blue-900 pb-4">
                                    <i className="fas fa-star text-yellow-400 mr-3"></i>
                                    MA COLLECTION ({ownedGames.length})
                                </h2>
                                <div className="grid grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                                    {ownedGames.map(game => <GameCard key={game.id} game={game} toggleStatus={toggleGameStatus} onDelete={deleteGame} onEdit={handleEdit} />)}
                                    {ownedGames.length === 0 && <p className="col-span-full text-center font-terminal text-xl text-gray-500 mt-10">Aucun jeu possédé ici...</p>}
                                </div>
                            </div>

                            {/* COLUMN: WANTED GAMES */}
                            <div className="bg-[#1a0a10] border border-pink-900 rounded-xl p-4 md:p-6 shadow-[inset_0_0_50px_rgba(255,0,127,0.05)] h-full">
                                <h2 className="font-pixel text-xl md:text-2xl mb-6 text-center neon-text-pink border-b-2 border-pink-900 pb-4">
                                    <i className="fas fa-crosshairs text-red-500 mr-3"></i>
                                    RECHERCHÉS ({wantedGames.length})
                                </h2>
                                <div className="grid grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                                    {wantedGames.map(game => <GameCard key={game.id} game={game} toggleStatus={toggleGameStatus} onDelete={deleteGame} onEdit={handleEdit} />)}
                                    {wantedGames.length === 0 && <p className="col-span-full text-center font-terminal text-xl text-gray-500 mt-10">Liste de recherche vide !</p>}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const GameCard = ({ game, toggleStatus, onDelete, onEdit }) => {
            const isOwned = game.status === "owned";
            
            // Console visual identification
            let consoleColor = "text-gray-400";
            if (game.console === "Megadrive") consoleColor = "text-red-500";
            if (game.console === "Super Famicom") consoleColor = "text-yellow-400";
            if (game.console === "Master System") consoleColor = "text-blue-400";

            // Region Color Mapping
            const getRegionColorClass = (region) => {
                if (region === 'PAL') return 'bg-blue-900 text-blue-300 border border-blue-500';
                if (region === 'US') return 'bg-purple-900 text-purple-300 border border-purple-500';
                if (region === 'JAP') return 'bg-red-900 text-red-300 border border-red-500';
                return 'bg-gray-800 text-gray-300 border border-gray-500';
            };

            // AUTO-JAQUETTE: Astuce de hacker utilisant le moteur de miniatures ouvert de Bing
            const autoCoverUrl = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(game.title + ' ' + game.console + ' game box art cover')}`;
            
            // State pour gérer l'affichage de l'image (fournie par l'utilisateur OU auto-générée)
            const [imgSrc, setImgSrc] = React.useState(game.img || autoCoverUrl);

            // Mettre à jour l'image si la donnée du jeu change
            React.useEffect(() => {
                setImgSrc(game.img || autoCoverUrl);
            }, [game.img, autoCoverUrl]);

            return (
                <div className={`game-card relative bg-black flex flex-col h-full rounded-md overflow-hidden ${isOwned ? 'border border-blue-700 hover:border-blue-400' : 'border border-pink-700 hover:border-pink-400'}`}>
                    
                    {/* Top Left Badges: Region and Hz Compatibility */}
                    <div className="absolute top-2 left-2 z-20 flex flex-col gap-1 items-start">
                        {/* Region Badge */}
                        {game.region && (
                            <div className={`px-2 py-1 font-pixel text-[8px] rounded ${getRegionColorClass(game.region)}`}>
                                {game.region}
                            </div>
                        )}

                        {/* Hz Compatibility Badge (Megadrive only) */}
                        {(() => {
                            if (game.console === "Megadrive") {
                                const compInfo = getMegadriveCompatibility(game.title);
                                if (compInfo.status !== 'unknown') {
                                    const isComp = compInfo.status === 'compatible';
                                    return (
                                        <div 
                                            className={`px-2 py-1 font-pixel text-[8px] rounded cursor-help flex flex-col items-start shadow-md ${isComp ? 'bg-green-900 text-green-300 border border-green-500' : 'bg-orange-900 text-orange-300 border border-orange-500'}`}
                                            title={compInfo.note}
                                        >
                                            <span>{isComp ? '60Hz OK' : '60Hz BUG'}</span>
                                            {compInfo.note && compInfo.note !== 'Compatible 60Hz' && compInfo.note !== 'Incompatible 60Hz' && (
                                                <span className="text-[6px] opacity-80 mt-1 max-w-[100px] truncate">{compInfo.note}</span>
                                            )}
                                        </div>
                                    );
                                }
                            }
                            return null;
                        })()}
                    </div>

                    <button 
                        onClick={() => onEdit(game)}
                        className="absolute top-2 right-2 z-20 text-blue-400 opacity-70 hover:opacity-100 hover:text-blue-300 focus:opacity-100 transition-opacity bg-black/80 hover:bg-black rounded-full w-7 h-7 flex items-center justify-center text-sm border border-blue-900 hover:border-blue-500"
                        title="Actualiser/Modifier ce jeu"
                    >
                        <i className="fas fa-sync-alt"></i>
                    </button>

                    <div className="aspect-[3/4] w-full relative bg-gray-900 flex-shrink-0 virtual-box p-3 flex justify-center items-center">
                        <img 
                            src={imgSrc} 
                            alt={game.title} 
                            className="max-w-full max-h-full object-contain drop-shadow-[0_0_15px_rgba(0,0,0,0.5)] opacity-90 hover:opacity-100 transition-opacity" 
                            onError={() => { 
                                // Si l'image Wikipedia de la liste initiale meurt, on tente notre auto-jaquette magique.
                                if (imgSrc !== autoCoverUrl) {
                                    setImgSrc(autoCoverUrl);
                                } else {
                                    setImgSrc(''); // Si même l'auto-jaquette échoue, on masque l'image brisée.
                                }
                            }} 
                            style={{ display: imgSrc ? 'block' : 'none' }}
                        />
                        {!imgSrc && (
                            <div className="w-full h-full flex items-center justify-center font-pixel text-[8px] text-gray-500 text-center p-2">SANS IMAGE</div>
                        )}
                        <button 
                            onClick={() => onDelete(game.id)}
                            className="absolute bottom-2 right-2 z-20 text-red-500 opacity-70 hover:opacity-100 hover:text-red-400 focus:opacity-100 transition-opacity bg-black/80 hover:bg-black rounded-full w-7 h-7 flex items-center justify-center text-sm border border-red-900 hover:border-red-500"
                            title="Supprimer ce jeu"
                        >
                            <i className="fas fa-trash"></i>
                        </button>
                    </div>

                    <div className="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 className="font-pixel text-[10px] sm:text-xs mb-1 text-white truncate" title={game.title}>{game.title}</h3>
                            <p className={`font-terminal text-base sm:text-lg mb-2 ${consoleColor}`}>{game.console}</p>
                        </div>
                        
                        {/* Raccourcis Marché (Uniquement pour les jeux Recherchés) */}
                        {!isOwned && (
                            <div className="flex gap-2 mt-1 mb-3">
                                <a 
                                    href={`https://www.leboncoin.fr/recherche?text=${encodeURIComponent(game.title + ' ' + game.console)}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="flex-1 bg-[#ff6e14] hover:bg-[#e56312] text-white font-pixel text-[6px] sm:text-[7px] py-2 px-1 text-center rounded-sm transition-colors shadow-[0_0_5px_rgba(255,110,20,0.4)]"
                                    title="Chercher sur Leboncoin"
                                >
                                    <i className="fas fa-shopping-bag mr-1"></i>LBC
                                </a>
                                <a 
                                    href={`https://www.ebay.fr/sch/i.html?_nkw=${encodeURIComponent(game.title + ' ' + game.console + (game.region && game.region !== 'PAL' ? ' ' + game.region : ''))}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="flex-1 bg-[#0064d2] hover:bg-[#0052ad] text-white font-pixel text-[6px] sm:text-[7px] py-2 px-1 text-center rounded-sm transition-colors shadow-[0_0_5px_rgba(0,100,210,0.4)]"
                                    title="Chercher sur eBay"
                                >
                                    <i className="fab fa-ebay text-[9px] mr-1"></i>eBay
                                </a>
                            </div>
                        )}

                        <button 
                            onClick={() => toggleStatus(game.id)}
                            className={`w-full py-2 mt-auto font-pixel text-[8px] uppercase transition-colors ${isOwned ? 'bg-blue-900 hover:bg-blue-800 text-blue-200' : 'bg-pink-900 hover:bg-pink-800 text-pink-200'}`}
                        >
                            {isOwned ? 'Mettre en Recherchés' : 'Marquer Possédé'}
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
