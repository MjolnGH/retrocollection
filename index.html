    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-purple: #8a2be2;
            --dark-bg: #050510;
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            /* Retro synthwave grid background */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center bottom;
            background-attachment: fixed;
        }

        /* CRT Screen Effect Overlay */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .font-pixel { font-family: 'Press Start 2P', cursive; }
        .font-terminal { font-family: 'VT323', monospace; }

        .neon-text-pink { text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        .neon-text-blue { text-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); }

        .neon-border-pink {
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink), inset 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .neon-border-blue {
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(0, 240, 255, 0.5);
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-pink); }

        .game-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .game-card:hover { transform: translateY(-5px) scale(1.02); z-index: 10; }

        .virtual-box {
            background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
            position: relative;
            overflow: hidden;
        }
        .virtual-box::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .custom-scrollbar-mini::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar-mini::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar-mini::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 2px; }
    </style>

        const initialGames = [];

        const getMatchInfo = (list, title) => {
            const normInput = title.toLowerCase().replace(/[^a-z0-9]/g, '');
            for (let item of list) {
                const match = item.match(/(.*?)(?:\((.*)\))?$/);
                const rawName = match[1].trim();
                const note = match[2] ? match[2].trim() : null;
                const normList = rawName.toLowerCase().replace(/[^a-z0-9]/g, '');
                
                if (normList === normInput || 
                    (normList.length > 5 && normInput.includes(normList)) || 
                    (normInput.length > 5 && normList.includes(normInput))) {
                    return { found: true, note };
                }
            }
            return { found: false };
        };

        const getMegadriveCompatibility = (title) => {
            if (!title) return { status: 'unknown', note: null };
            const incomp = getMatchInfo(mdIncompatibleRaw, title);
            if (incomp.found) return { status: 'incompatible', note: incomp.note || 'Incompatible 60Hz' };
            const comp = getMatchInfo(mdCompatibleRaw, title);
            if (comp.found) return { status: 'compatible', note: comp.note || 'Compatible 60Hz' };
            return { status: 'unknown', note: null };
        };

            const [syncStatus, setSyncStatus] = React.useState('idle'); 
            const [authError, setAuthError] = React.useState(null);

            const [dialogState, setDialogState] = React.useState({ isOpen: false, type: 'alert', message: '', onConfirm: null, onCancel: null });

            const showAlert = (message) => {
                setDialogState({ isOpen: true, type: 'alert', message, onConfirm: () => setDialogState({ ...dialogState, isOpen: false }) });
            };

            const showConfirm = (message, onConfirmCallback) => {
                setDialogState({
                    isOpen: true, 
                    type: 'confirm', 
                    message, 
                    onConfirm: () => {
                        onConfirmCallback();
                        setDialogState({ ...dialogState, isOpen: false });
                    },
                    onCancel: () => setDialogState({ ...dialogState, isOpen: false })
                });
            };

            React.useEffect(() => {
                let unsubscribeDoc = null;

                const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
                    if (unsubscribeDoc) {
                        unsubscribeDoc();
                        unsubscribeDoc = null;
                    }

                    if (user) {
                        // Utilisateur connecté via Google
                        setCurrentUser(user);
                        setAuthError(null);
                        
                        // CORRECTION CRITIQUE DU CHEMIN (Doit correspondre aux règles Firestore - nb PAIR)
                        const docRef = doc(db, 'users', user.uid);

                        unsubscribeDoc = onSnapshot(docRef, (docSnap) => {
                            if (docSnap.exists()) {
                                const cloudData = docSnap.data();
                                if (cloudData && Array.isArray(cloudData.games)) {
                                    setGames(cloudData.games);
                                    localStorage.setItem('retroTrackerData', JSON.stringify(cloudData.games));
                                    setSyncStatus('saved');
                                    setTimeout(() => setSyncStatus('idle'), 2000);
                                }

                                const currentGames = JSON.parse(localStorage.getItem('retroTrackerData')) || games;

                const targetGame = games.find(game => game.id === id);
                if (!targetGame) return;
                const updatedGame = { ...targetGame, status: targetGame.status === "owned" ? "wanted" : "owned" };
                const otherGames = games.filter(game => game.id !== id);
                saveGamesData([updatedGame, ...otherGames]);
            };

            const deleteGame = (id) => { saveGamesData(games.filter(game => game.id !== id)); };

                        ...g, title: newTitle, console: newConsole, status: newStatus, region: newRegion, img: newImg
                    } : g);
                    setEditingId(null);
                } else {
                    const newGame = {
                        id: Date.now(), title: newTitle, console: newConsole, status: newStatus, region: newRegion, img: newImg
                    };
                    updatedList = [newGame, ...games];
                }
                
                saveGamesData(updatedList);
                setNewTitle(""); setNewImg(""); setShowAddForm(false);
            };

            const handleEdit = (game) => {
                setNewTitle(game.title); setNewConsole(game.console); setNewRegion(game.region);
                setNewStatus(game.status); setNewImg(game.img || ""); setEditingId(game.id);
                setShowAddForm(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleToggleForm = () => {
                if (showAddForm) { setEditingId(null); setNewTitle(""); setNewImg(""); }
                setShowAddForm(!showAddForm);
            };

            const exportJSON = () => {
                try {
                    const dataStr = JSON.stringify(games, null, 2);
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'sauvegarde_collection.json';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    showAlert("Une erreur s'est produite lors de l'export.");
                }
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    try {
                        const data = JSON.parse(content);
                        if (Array.isArray(data)) {
                            showConfirm("Remplacer votre collection actuelle par le contenu de ce fichier ?", () => {
                                saveGamesData(data);
                            });
                            return;
                        }
                    } catch (err) {
                        // Tentative d'extraction depuis un export HTML
                        const match = content.match(/const initialGames = (\[[\s\S]*?\]);\s*const CONSOLES/);
                        if (match && match[1]) {
                            try {
                                const extractedGames = JSON.parse(match[1]);
                                if (Array.isArray(extractedGames)) {
                                    showConfirm("Importer la collection contenue dans ce fichier HTML ? Cela remplacera la vôtre.", () => {
                                        saveGamesData(extractedGames);
                                    });
                                    return;
                                }
                            } catch (e2) {}
                        }
                        showAlert("Erreur : Impossible de lire les données. Fichier invalide.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const filteredGames = games.filter(g => {
                const matchesConsole = activeConsole === "Toutes" || g.console === activeConsole;
                const matchesSearch = g.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesConsole && matchesSearch;
            });

            const sortedGames = [...filteredGames].sort((a, b) => {
                if (sortMode === "alpha") return a.title.localeCompare(b.title);
                return b.id - a.id;
            });

            const ownedGames = sortedGames.filter(g => g.status === "owned");
            const wantedGames = sortedGames.filter(g => g.status === "wanted");

            return (
                <div className="container mx-auto px-4 py-6 max-w-7xl relative z-10 font-terminal">
                    
                    <CustomDialog {...dialogState} />

                    {}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-purple-900/50 pb-6">
                        <div>
                            <h1 className="font-pixel text-2xl sm:text-3xl md:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 font-bold mb-2">
                                RETROCOLLEC ONLINE
                            </h1>
                            <p className="text-gray-400 text-lg sm:text-xl">Gestionnaire de Collection Sécurisé</p>
                        </div>

                        <div className="inline-flex flex-col sm:flex-row items-center gap-3 bg-gray-900/90 border border-purple-500/50 px-4 py-2 rounded-2xl text-xs font-pixel shadow-lg">
                            <div className="flex items-center gap-2">
                                {currentUser ? (
                                    <>
                                        <span className="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></span>
                                        <span className="text-green-300">CLOUD</span>
                                        {syncStatus === 'syncing' && <span className="text-yellow-400 text-[9px] ml-1">(Envoi...)</span>}
                                        {syncStatus === 'saved' && <span className="text-blue-300 text-[9px] ml-1">(✓)</span>}
                                        {syncStatus === 'error' && <span className="text-red-400 text-[9px] ml-1">(Erreur)</span>}
                                        <div className="h-4 w-px bg-purple-500/40 mx-2 hidden sm:block"></div>
                                        <span className="text-blue-200 lowercase truncate max-w-[150px]" title={currentUser.email}>{currentUser.displayName || currentUser.email}</span>
                                        <button onClick={handleLogout} className="ml-2 bg-gray-700 hover:bg-red-600 text-white p-1.5 rounded-full transition-colors" title="Se déconnecter">
                                            <i className="fas fa-sign-out-alt"></i>
                                        </button>
                                    </>
                                ) : (
                                    <>
                                        <span className="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
                                        <span className="text-yellow-300">LOCAL (Hors ligne)</span>
                                        <div className="h-4 w-px bg-purple-500/40 mx-2 hidden sm:block"></div>
                                        <button onClick={handleLogin} className="bg-white hover:bg-gray-200 text-gray-900 font-sans font-bold text-[10px] px-3 py-1.5 rounded-full flex items-center gap-2 transition-colors">
                                            <i className="fab fa-google text-red-500 text-sm"></i>
                                            <span>Connexion</span>
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    </header>

                    {authError && (
                        <div className="mb-6 p-4 bg-red-950/90 border border-red-500 rounded text-red-200 font-terminal text-xl text-center">
                            <i className="fas fa-exclamation-triangle mr-2 text-yellow-400"></i> {authError}
                        </div>
                    )}

                    {}
                    <div className="mb-8 space-y-6">
                        <div className="flex flex-wrap justify-center gap-2 mb-6">
                            {CONSOLES.map(c => (
                                <button key={c} onClick={() => setActiveConsole(c)} className={`font-pixel text-[10px] sm:text-xs py-2 px-4 uppercase transition-all ${activeConsole === c ? 'bg-purple-600 text-white neon-border-blue' : 'bg-gray-800 text-gray-400 border border-gray-600 hover:bg-gray-700'}`}>
                                    {c}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="relative w-full md:flex-1">
                                <i className="fas fa-search absolute left-3 top-3 text-blue-400"></i>
                                <input type="text" placeholder="Rechercher un jeu..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-gray-900 border-2 border-blue-500 text-blue-300 rounded-none py-2 pl-10 pr-4 font-terminal text-xl focus:outline-none focus:border-pink-500 transition-colors"/>
                            </div>

                            <div className="relative w-full md:w-48">
                                <i className="fas fa-sort absolute left-3 top-3 text-pink-400"></i>
                                <select value={sortMode} onChange={(e) => setSortMode(e.target.value)} className="w-full bg-gray-900 border-2 border-pink-500 text-pink-300 rounded-none py-2 pl-10 pr-4 font-terminal text-xl focus:outline-none focus:border-blue-500 transition-colors appearance-none cursor-pointer">
                                    <option value="ajout">Tri : Ajout</option>
                                    <option value="alpha">Tri : A - Z</option>
                                </select>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto flex-wrap justify-end">
                                <button onClick={handleToggleForm} className="w-full sm:w-auto bg-pink-600 hover:bg-pink-500 text-white font-pixel text-[9px] sm:text-[10px] py-3 px-3 neon-border-pink uppercase transition-all whitespace-nowrap">
                                    <i className={`fas ${showAddForm ? 'fa-times' : (editingId ? 'fa-edit' : 'fa-plus')} mr-1`}></i> {showAddForm ? 'Fermer' : (editingId ? 'Modifier' : 'Ajouter')}
                                </button>
                                
                                <button onClick={exportJSON} className="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-pixel text-[9px] sm:text-[10px] py-3 px-3 neon-border-blue uppercase transition-all whitespace-nowrap">
                                    <i className="fas fa-file-export mr-1"></i> Sauvegarder
                                </button>

                                <input type="file" id="importFile" accept=".json,.txt,.html" style={{display: 'none'}} onChange={handleImport} />
                                <button onClick={() => document.getElementById('importFile').click()} className="w-full sm:w-auto bg-green-600 hover:bg-green-500 text-white font-pixel text-[9px] sm:text-[10px] py-3 px-3 neon-border-blue uppercase transition-all whitespace-nowrap">
                                    <i className="fas fa-file-import mr-1"></i> Importer
                                </button>
                            </div>
                        </div>

                        {}
                        {showAddForm && (
                            <form onSubmit={handleSubmit} className="bg-gray-900 border-2 border-purple-500 p-6 shadow-[0_0_15px_#8a2be2] mb-8 animate-[fadeIn_0.3s_ease-out]">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 items-end">
                                    <div className="lg:col-span-2 relative">
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Titre du jeu</label>
                                        <input required type="text" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:border-pink-500 focus:outline-none"/>
                                        {newConsole === "Megadrive" && newTitle && (
                                            <div className="absolute top-[102%] left-0 text-[10px] font-pixel z-10 p-1 bg-black border border-gray-700 rounded w-full">
                                                {(() => {
                                                    const info = getMegadriveCompatibility(newTitle);
                                                    if (info.status === 'compatible') return <span className="text-green-400">✓ {info.note}</span>;
                                                    if (info.status === 'incompatible') return <span className="text-red-400">⚠ {info.note}</span>;
                                                    return <span className="text-gray-500">Statut 60Hz inconnu</span>;
                                                })()}
                                            </div>
                                        )}
                                    </div>
                                    <div>
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Console</label>
                                        <select value={newConsole} onChange={(e) => setNewConsole(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:outline-none">
                                            <option>Megadrive</option><option>Super Famicom</option><option>Master System</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Région</label>
                                        <select value={newRegion} onChange={(e) => setNewRegion(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:outline-none">
                                            <option value="PAL">PAL</option><option value="US">US</option><option value="JAP">JAP</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">Statut</label>
                                        <select value={newStatus} onChange={(e) => setNewStatus(e.target.value)} className="w-full bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:outline-none">
                                            <option value="wanted">Recherchés</option><option value="owned">Possédé</option>
                                        </select>
                                    </div>
                                    <div>
                                        <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-pixel text-[10px] py-3 px-4 neon-border-blue h-[46px]">
                                            {editingId ? 'MODIFIER' : 'AJOUTER'}
                                        </button>
                                    </div>
                                    <div className="lg:col-span-6">
                                        <label className="block font-terminal text-pink-400 text-xl mb-1">URL Image (Optionnel)</label>
                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <input type="text" value={newImg} onChange={(e) => setNewImg(e.target.value)} className="flex-1 bg-black border border-purple-500 text-white p-2 font-terminal text-xl focus:border-pink-500 focus:outline-none" placeholder="Laissez vide pour une recherche automatique..."/>
                                            {newTitle && (
                                                <a href={`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(newTitle + ' ' + newConsole + ' ' + newRegion + ' cover box art')}`} target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-pixel text-[10px] py-2 px-4 flex items-center justify-center neon-border-blue transition-colors uppercase whitespace-nowrap">
                                                    <i className="fas fa-search mr-2"></i> Chercher
                                                </a>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </form>
                        )}
            
                        {}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="bg-[#0a0a1a] border border-blue-900 rounded-xl p-4 md:p-6 shadow-[inset_0_0_50px_rgba(0,240,255,0.05)] h-full">
                                <h2 className="font-pixel text-xl md:text-2xl mb-6 text-center neon-text-blue border-b-2 border-blue-900 pb-4">
                                    <i className="fas fa-star text-yellow-400 mr-3"></i> MA COLLECTION ({ownedGames.length})
                                </h2>
                                <div className="grid grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                                    {ownedGames.map(game => <GameCard key={game.id} game={game} toggleStatus={toggleGameStatus} onDelete={deleteGame} onEdit={handleEdit} />)}
                                    {ownedGames.length === 0 && <p className="col-span-full text-center font-terminal text-xl text-gray-500 mt-10">Aucun jeu possédé ici...</p>}
                                </div>
                            </div>

                            <div className="bg-[#1a0a10] border border-pink-900 rounded-xl p-4 md:p-6 shadow-[inset_0_0_50px_rgba(255,0,127,0.05)] h-full">
                                <h2 className="font-pixel text-xl md:text-2xl mb-6 text-center neon-text-pink border-b-2 border-pink-900 pb-4">
                                    <i className="fas fa-crosshairs text-red-500 mr-3"></i> RECHERCHÉS ({wantedGames.length})
                                </h2>
                                <div className="grid grid-cols-2 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                                    {wantedGames.map(game => <GameCard key={game.id} game={game} toggleStatus={toggleGameStatus} onDelete={deleteGame} onEdit={handleEdit} />)}
                                    {wantedGames.length === 0 && <p className="col-span-full text-center font-terminal text-xl text-gray-500 mt-10">Liste de recherche vide !</p>}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const GameCard = ({ game, toggleStatus, onDelete, onEdit }) => {
            const isOwned = game.status === "owned";
            let consoleColor = "text-gray-400";
            if (game.console === "Megadrive") consoleColor = "text-red-500";
            if (game.console === "Super Famicom") consoleColor = "text-yellow-400";
            if (game.console === "Master System") consoleColor = "text-blue-400";

            const getRegionColorClass = (region) => {
                if (region === 'PAL') return 'bg-blue-900 text-blue-300 border border-blue-500';
                if (region === 'US') return 'bg-purple-900 text-purple-300 border border-purple-500';
                if (region === 'JAP') return 'bg-red-900 text-red-300 border border-red-500';
                return 'bg-gray-800 text-gray-300 border border-gray-500';
            };

            const autoCoverUrl = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(game.title + ' ' + game.console + ' game box art cover')}`;
            const [imgSrc, setImgSrc] = React.useState(game.img || autoCoverUrl);

            React.useEffect(() => { setImgSrc(game.img || autoCoverUrl); }, [game.img, autoCoverUrl]);

            return (
                <div className={`game-card relative bg-black flex flex-col h-full rounded-md overflow-hidden ${isOwned ? 'border border-blue-700 hover:border-blue-400' : 'border border-pink-700 hover:border-pink-400'}`}>
                    <div className="absolute top-2 left-2 z-20 flex flex-col gap-1 items-start">
                        {game.region && <div className={`px-2 py-1 font-pixel text-[8px] rounded ${getRegionColorClass(game.region)}`}>{game.region}</div>}
                        {(() => {
                            if (game.console === "Megadrive") {
                                const compInfo = getMegadriveCompatibility(game.title);
                                if (compInfo.status !== 'unknown') {
                                    const isComp = compInfo.status === 'compatible';
                                    return (
                                        <div className={`px-2 py-1 font-pixel text-[8px] rounded cursor-help flex flex-col items-start shadow-md ${isComp ? 'bg-green-900 text-green-300 border border-green-500' : 'bg-orange-900 text-orange-300 border border-orange-500'}`} title={compInfo.note}>
                                            <span>{isComp ? '60Hz OK' : '60Hz BUG'}</span>
                                            {compInfo.note && compInfo.note !== 'Compatible 60Hz' && compInfo.note !== 'Incompatible 60Hz' && (
                                                <span className="text-[6px] opacity-80 mt-1 max-w-[100px] truncate">{compInfo.note}</span>
                                            )}
                                        </div>
                                    );
                                }
                            }
                            return null;
                        })()}
                    </div>

                    <button onClick={() => onEdit(game)} className="absolute top-2 right-2 z-20 text-blue-400 opacity-70 hover:opacity-100 hover:text-blue-300 focus:opacity-100 transition-opacity bg-black/80 hover:bg-black rounded-full w-7 h-7 flex items-center justify-center text-sm border border-blue-900 hover:border-blue-500" title="Actualiser/Modifier ce jeu">
                        <i className="fas fa-sync-alt"></i>
                    </button>

                    <div className="aspect-[3/4] w-full relative bg-gray-900 flex-shrink-0 virtual-box p-3 flex justify-center items-center">
                        <img 
                            src={imgSrc} alt={game.title} 
                            className="max-w-full max-h-full object-contain drop-shadow-[0_0_15px_rgba(0,0,0,0.5)] opacity-90 hover:opacity-100 transition-opacity" 
                            onError={() => { if (imgSrc !== autoCoverUrl) { setImgSrc(autoCoverUrl); } else { setImgSrc(''); } }} 
                            style={{ display: imgSrc ? 'block' : 'none' }}
                        />
                        {!imgSrc && <div className="w-full h-full flex items-center justify-center font-pixel text-[8px] text-gray-500 text-center p-2">SANS IMAGE</div>}
                        <button onClick={() => onDelete(game.id)} className="absolute bottom-2 right-2 z-20 text-red-500 opacity-70 hover:opacity-100 hover:text-red-400 focus:opacity-100 transition-opacity bg-black/80 hover:bg-black rounded-full w-7 h-7 flex items-center justify-center text-sm border border-red-900 hover:border-red-500" title="Supprimer ce jeu">
                            <i className="fas fa-trash"></i>
                        </button>
                    </div>

                    <div className="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 className="font-pixel text-[10px] sm:text-xs mb-1 text-white truncate" title={game.title}>{game.title}</h3>
                            <p className={`font-terminal text-base sm:text-lg mb-2 ${consoleColor}`}>{game.console}</p>
                        </div>
                        
                        {!isOwned && (
                            <div className="flex gap-2 mt-1 mb-3">
                                <a href={`https://www.leboncoin.fr/recherche?text=${encodeURIComponent(game.title + ' ' + game.console)}`} target="_blank" rel="noopener noreferrer" className="flex-1 bg-[#ff6e14] hover:bg-[#e56312] text-white font-pixel text-[6px] sm:text-[7px] py-2 px-1 text-center rounded-sm transition-colors shadow-[0_0_5px_rgba(255,110,20,0.4)]" title="Chercher sur Leboncoin">
                                    <i className="fas fa-shopping-bag mr-1"></i>LBC
                                </a>
                                <a href={`https://www.ebay.fr/sch/i.html?_nkw=${encodeURIComponent(game.title + ' ' + game.console + (game.region && game.region !== 'PAL' ? ' ' + game.region : ''))}`} target="_blank" rel="noopener noreferrer" className="flex-1 bg-[#0064d2] hover:bg-[#0052ad] text-white font-pixel text-[6px] sm:text-[7px] py-2 px-1 text-center rounded-sm transition-colors shadow-[0_0_5px_rgba(0,100,210,0.4)]" title="Chercher sur eBay">
                                    <i className="fab fa-ebay text-[9px] mr-1"></i>eBay
                                </a>
                            </div>
                        )}

                        <button onClick={() => toggleStatus(game.id)} className={`w-full py-2 mt-auto font-pixel text-[8px] uppercase transition-colors ${isOwned ? 'bg-blue-900 hover:bg-blue-800 text-blue-200' : 'bg-pink-900 hover:bg-pink-800 text-pink-200'}`}>
                            {isOwned ? 'Mettre en Recherchés' : 'Marquer Possédé'}
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
